# Vono Studio sitesi — cd docker-compose && docker compose up -d --build
#
# Sunucu 8081 portunu dinler ve varsayılan olarak yalnızca 127.0.0.1'e açılır:
# dışarıya HAProxy açar. Ayarlar için .env dosyasına bakın (.env.example'ı kopyalayın).
name: vonostudio

services:
  web:
    build:
      context: ..
      dockerfile: docker-compose/Dockerfile
      args:
        # Derleme zamanında gömülür — değiştirince --build ile yeniden kurun.
        SITE_URL: ${SITE_URL:-https://vonostudio.com}
    image: vonostudio:${TAG:-latest}
    container_name: vonostudio-web
    restart: unless-stopped

    ports:
      # HAProxy aynı sunucuda olduğu için sadece localhost'a bağlanır.
      # HAProxy başka bir makinede/ağdaysa BIND_ADDRESS=0.0.0.0 yapın.
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-8081}:8081"

    environment:
      CONTENT_DB: /data/content.db
      # İletişim formu → ERP (bkz. .env.example). Boşsa form kapalıdır.
      ERP_INTAKE_URL: "${ERP_INTAKE_URL:-}"
      ERP_INTAKE_KEY: "${ERP_INTAKE_KEY:-}"
      # Panelin taslak önizlemesi (isteğe bağlı, bkz. .env.example). İkisi de
      # boşsa önizleme kapalıdır ve site yalnız yayındaki sürümü sunar.
      CONTENT_DRAFT_DB: "${CONTENT_DRAFT_DB:-}"
      PREVIEW_TOKEN: "${PREVIEW_TOKEN:-}"

    # Konteynerin çalıştığı kullanıcı. Bind mount edilen klasörün sahibiyle
    # aynı olmalı; `id -u`:`id -g` çıktısını .env içine yazabilirsiniz.
    user: "${RUN_AS:-1000:1000}"

    volumes:
      # İçerik veritabanının durduğu KLASÖR — tek dosya değil. SQLite yanına
      # -wal ve -shm dosyaları açar ve düzenleme arayüzü dosyayı yerinden
      # değiştirebilir; ikisi de ancak klasör mount edilirse doğru çalışır.
      # Düzenleme arayüzü de aynı klasörü bağlayarak yazar.
      # Videolar bu klasörün içindeki content-medya/ altında durur (veritabanında
      # değil) — ayrı bir bağlama gerekmez, ama YEDEKTE klasörün tamamı alınmalı.
      - ${DB_DIR:-./data}:/data

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
